# Site settings
title: Robbert van der Burg
description: >-
  Academic website of Rob, PhD candidate at VU University Amsterdam.
  Probability theory, network science, and applied statistics.
baseurl: "" # e.g. "/your-repo-name" if not using custom domain
url: "https://robbertvanderburg.github.io" # e.g. "https://yourusername.github.io"

# Author
author:
  name: Robbert van der Burg
  email: r.vander.burg@vu.nl
  position: PhD candidate
  affiliation: VU University Amsterdam
  department: Department of Mathematics
  address: De Boelelaan 1111, 1081 HV Amsterdam
  google_scholar: "" # Your Google Scholar ID (the part after user= in your profile URL)
  semantic_scholar: "" # Your Semantic Scholar author ID
  orcid: "0009-0007-4945-6120"
  github: "robbertvanderburg"
  linkedin: "robbert-van-der-burg/"

# Build settings
markdown: kramdown
sass:
  style: compressed

# Collections
collections:
  news:
    output: false
    sort_by: date

# Defaults
defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: null

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
