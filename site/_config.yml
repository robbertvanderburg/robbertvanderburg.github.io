# Site settings
title: Rob — Researcher
description: >-
  Academic website of Rob, PhD researcher at VU University Amsterdam.
  Probability theory, network science, and applied statistics.
baseurl: "" # e.g. "/your-repo-name" if not using custom domain
url: "" # e.g. "https://yourusername.github.io"

# Author
author:
  name: Rob
  email: your.email@vu.nl
  position: PhD Researcher
  affiliation: VU University Amsterdam
  department: Department of Mathematics
  address: De Boelelaan 1111, 1081 HV Amsterdam
  google_scholar: "" # Your Google Scholar ID (the part after user= in your profile URL)
  semantic_scholar: "" # Your Semantic Scholar author ID
  orcid: ""
  github: ""
  linkedin: ""

# Build settings
markdown: kramdown
sass:
  style: compressed

# Collections
collections:
  news:
    output: false
    sort_by: date

# Defaults
defaults:
  - scope:
      path: ""
      type: "news"
    values:
      layout: null

# Plugins (GitHub Pages supported)
plugins:
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
