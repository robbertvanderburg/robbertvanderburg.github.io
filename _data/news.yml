- date: 2026-06-24
  category: Conference talk
  title: Bayesian Recovery of Dependence Structures on Networks
  text: "At the Dutch NetSci Summer Symposium I presented joint work with Alessandro Zocca and Frank van der Meulen. We used empirical Bayesian estimation to distinguish network-driven dependence from correlations induced by external covariates. Our approach combines covariate-dependent Ising models with spike-and-slab priors to quantify uncertainty in the inferred network."
  venue: Dutch NetSci Summer Symposium
  slides: /NetSci_Presentation_fin.pdf

- date: 2026-03-30
  category: Preprint
  title: Random walks with traversal costs
  text: "Thao Le, Bernd Heidergott, Ines Lindner, Alessandro Zocca and I introduced weighted Markovian graphs to separate random walk dynamics from potentially stochastic edge traversal costs. We derived the mean and variance of weighted first passage times and Kemeny constants, with applications to surveillance patrol policies and traffic networks under disruption."
  links:
    - {label: Read the preprint, url: "https://doi.org/10.48550/arXiv.2603.26414"}

