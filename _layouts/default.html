<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/dm-sans-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main" tabindex="-1" class="wrap">{{ content }}</main>
  {% include footer.html %}
  {% if page.url == '/publications/' %}<script defer src="{{ '/assets/js/publications.js' | relative_url }}"></script>{% endif %}
</body>
</html>
