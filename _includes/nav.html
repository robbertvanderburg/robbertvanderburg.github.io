<header class="masthead"><div class="wrap mast-inner">
  <a class="wordmark" href="{{ '/' | relative_url }}">{% include mark.html %}<span>{{ site.author.name }}</span></a>
  <button type="button" class="menu-toggle" aria-controls="primary-nav" aria-expanded="false" hidden>Menu</button>
  <nav id="primary-nav" aria-label="Main navigation">{% include nav-links.html %}</nav>
  <button type="button" class="theme-toggle" aria-label="Dark theme" aria-pressed="false" hidden><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><path fill="currentColor" stroke="none" d="M12 4a8 8 0 0 1 0 16Z"/></svg></button>
  <a class="header-contact" href="mailto:{{ site.author.email }}">Contact</a>
</div></header>
