<footer class="footer">
<div class="wrap">

  <p>{{ site.author.department }}, {{ site.author.affiliation }}</p>
  </div>
  <nav aria-label="Footer navigation">{% include nav-links.html %}<a href="{{ '/#contact' | relative_url }}">Contact</a>

  <div class="fineprint"><span>© {{ 'now' | date: '%Y' }} {{ site.author.name }}</span><a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
  </div>
</div>
</footer>
